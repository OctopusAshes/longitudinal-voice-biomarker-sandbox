[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "longitudinal-voice-biomarker-sandbox"
version = "0.1.0"
description = "A synthetic sandbox for longitudinal voice-monitoring assumptions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "gradio>=5,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
